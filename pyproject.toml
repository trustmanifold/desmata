[project]
name = "desmata"
version = "0.1.0"
description = "A package manager using content-addressing and reproducible builds via Nix."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matt Rixman", email = "MatrixManAtYrService@users.noreply.github.com" },
]
dependencies = [
    "typer>=0.9.0",
    "pdoc>=14.4.0",
    "xdg-base-dirs>=6.0.1",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.3.3",
    "rich>=13.7.1",
    "injector>=0.21.0",
    "sqlmodel>=0.0.19",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pyfiglet>=1.0.2",
]

[project.scripts]
desmata = "desmata.cli.desmata:cli"
dsm = "desmata.cli.dsm:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desmata"]
