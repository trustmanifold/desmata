[pytest]
pythonpath = ./src
# Default `pytest` runs only the fast unit suite. The slow, podman-based
# end-to-end tests live under e2e/ and are run explicitly (`pytest e2e`);
# the multi-daemon peer-discovery test is opt-in too (`pytest -m peernet`).
addopts = -m "not peernet and not wasm and not browser"
markers =
    peernet: multi-node ipfs-daemon tests (slow; needs NUSHELL_CELL_SRC from the dev shell)
    wasm: lightweight-cell tests that build wasmtime, nushell, and the gn oracle with nix (slow; need GNIZE_CELL_SRC and NUSHELL_CELL_SRC from the dev shell)
    browser: headless-chromium runner tests (slow; need GNIZE_CELL_SRC plus nix-built runner-cell and chromium)
testpaths = test
